<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}} | Business User Guide</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600&amp;display=swap');
    :root {
      --primary: #0f172a;
      --ld-purple: #6B2D8F;
      --ld-purple-light: #F3E8FF;
      --ld-green: #A6CE39;
      --ld-green-light: #EDF6DC;
      --ld-green-text: #3D5220;
      --ld-grey-light: #F1F5F9;
    }
    body { font-family: 'Inter', system_ui, sans-serif; }
    .font-display { font-family: 'Space Grotesk', 'Inter', sans-serif; }
    .prose h1, .prose h2, .prose h3 { font-family: 'Space Grotesk', sans-serif; }
    .metric-card { transition: transform .1s ease, box-shadow .1s ease; }
    .metric-card:hover { transform: translateY(-1px); box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.05); }
    .nav-active { border-bottom: 3px solid #6B2D8F; font-weight: 600; }
    .doc-section { scroll-margin-top: 96px; }
    html { scroll-behavior: smooth; }
    .friendly { color: #0f172a; }
    .doc-content table {
      border-collapse: collapse;
      border-top: 2px solid #e2e8f0;
      border-bottom: 2px solid #e2e8f0;
      border-left: 1px solid #e2e8f0;
      border-right: 1px solid #e2e8f0;
      width: 100%;
    }
    .doc-content table th,
    .doc-content table td {
      border-left: 1px solid #e2e8f0;
      border-right: 1px solid #e2e8f0;
      border-top: 2px solid #e2e8f0;
      border-bottom: 2px solid #e2e8f0;
      color: #000000;
      text-align: left;
      padding: 0.5rem 0.75rem;
    }
    .doc-content table th {
      background-color: var(--ld-green-light);
      font-weight: 600;
    }
    .doc-content table td {
      background-color: var(--ld-grey-light);
    }
    .toc a:hover { color: #6B2D8F; }
    .callout { border-left: 4px solid #6B2D8F; }
    .doc-content ul {
      list-style-type: disc;
      list-style-position: outside;
      padding-left: 1.75rem;
      margin: 0.75rem 0 1rem;
    }
    .doc-content ul > li {
      display: list-item;
      padding-left: 0.25rem;
      margin-bottom: 0.4rem;
      line-height: 1.6;
    }
    .doc-content ol {
      list-style-type: decimal;
      list-style-position: outside;
      padding-left: 1.75rem;
      margin: 0.75rem 0 1rem;
    }
    .doc-content ol > li {
      display: list-item;
      padding-left: 0.25rem;
      margin-bottom: 0.4rem;
      line-height: 1.6;
    }
    .doc-content h2, .doc-content h3, .doc-content h4 { font-family: 'Space Grotesk', sans-serif; }
    .doc-content strong { color: #0f172a; font-weight: 600; }
    .doc-layout {
      display: flex;
      gap: 2rem;
      align-items: flex-start;
    }
    .doc-sidebar {
      width: 15rem;
      flex-shrink: 0;
      position: sticky;
      top: 6rem;
      max-height: calc(100vh - 7rem);
      overflow-y: auto;
      padding: 1rem 0.75rem;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 0.75rem;
    }
    .doc-sidebar-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #6B2D8F;
      margin-bottom: 0.75rem;
      padding: 0 0.5rem;
    }
    .doc-sidebar-toc .toc-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .doc-sidebar-toc .toc-list > li {
      margin-bottom: 0.35rem;
      line-height: 1.4;
    }
    .doc-sidebar-toc a.toc-link {
      display: block;
      padding: 0.35rem 0.5rem;
      border-radius: 0.375rem;
      color: #334155;
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 500;
    }
    .doc-sidebar-toc a.toc-link:hover {
      background: #F3E8FF;
      color: #6B2D8F;
    }
    .doc-main {
      flex: 1;
      min-width: 0;
    }
    @media (max-width: 1024px) {
      .doc-layout {
        flex-direction: column;
      }
      .doc-sidebar {
        width: 100%;
        position: static;
        max-height: none;
      }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800">
  <header class="bg-white border-b sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 py-3 flex items-center justify-between gap-6">
      <div class="font-semibold text-lg tracking-tight text-slate-900 shrink-0">{{LAYER_NAME}} Guide</div>
      <div class="flex items-center gap-x-3 text-sm">
        {{NAV_LINKS}}
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 pt-8 pb-20">
    <div class="mb-8">
      <h1 class="font-display text-4xl tracking-tight font-semibold text-slate-900">{{TITLE}}</h1>
      <p class="mt-2 text-base text-slate-600">{{TAGLINE}}</p>
    </div>

    <div class="doc-layout">
      <aside class="doc-sidebar">
        {{SIDEBAR_TOC}}
      </aside>
      <div class="doc-main">
        {{CONTENT}}
        <footer class="mt-16 pt-8 border-t text-sm text-slate-500 flex items-center justify-between">
          <div>Business user guide • {{DATE}}</div>
          <div>© {{YEAR}}</div>
        </footer>
      </div>
    </div>
  </main>

  <script>
    // Minimal enhancements
    console.log('%c[Semantic Docs] Standalone HTML ready', 'color:#64748b');
  </script>
</body>
</html>
